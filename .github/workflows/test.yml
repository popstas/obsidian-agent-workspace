name: test

# Ноги ubuntu и windows — на каждый push и PR. macOS вынесен в test-macos.yml
# и запускается только при правках того, что исполняет bash: очередь
# macOS-раннеров у GitHub бывает по 15 минут, а коммиты без .sh там ничего
# не проверяют. Шаги общие — в test-run.yml.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    uses: ./.github/workflows/test-run.yml
    with:
      os: '["ubuntu-latest", "windows-latest"]'
